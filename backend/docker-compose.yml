
services:
  postgres:
    image: postgres:18
    container_name: pokemarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokemarket
      POSTGRES_USER: pokemarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pokemarket_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: pokemarket-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - pokemarket_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  pokemarket_postgres_data:
    external: true

  pokemarket_redis_data:
